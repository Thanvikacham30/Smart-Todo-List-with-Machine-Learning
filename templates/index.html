<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Todo List</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>🌸 Smart Todo List 🌸</h1>

    <div class="input-box">

        <input
            type="text"
            id="taskInput"
            placeholder="Enter your task..."
        >

        <button onclick="predictReminder()">
            Check ML
        </button>

    </div>

    <div id="predictionBox"></div>

    <div class="reminder-box">

        <label>
            <input
                type="checkbox"
                id="reminderCheck"
            >
            Want Reminder?
        </label>

    </div>

    <div class="time-box">

        <input
            type="datetime-local"
            id="reminderTime"
        >

    </div>

    <button class="add-btn" onclick="addTask()">
        ➕ Add Task
    </button>

    <hr>

    <h2>Your Tasks</h2>

    <ul id="taskList">

    </ul>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
